version: '3.8'

services:
  backend:
    build: .
    ports:
      - "8080:3000"
    # Biến môi trường chuỗi kết nối PostgreSQL truyền vào container backend
    environment:
      - DATABASE_URL=postgres://postgres:postgres@db:5432/demodb
    # Thiết lập phụ thuộc: Đảm bảo container 'db' được khởi chạy trước 
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=demodb
    volumes:
      - postgres-data:/var/lib/postgresql/data

# Khai báo quản lý lưu trữ dữ liệu bền vững
volumes:
  postgres-data:
